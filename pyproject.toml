[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "postgenesis"
version = "0.1.0"
description = "Post-processing and visualization toolkit for Genesis FEL simulation results"
requires-python = ">=3.10"
authors = [{ name = "duoxup" }]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "h5py",
    "tqdm",
    # Private dependencies (install separately):
    #   dstrux
    #   xtils
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "black", "ipykernel"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["postgenesis*"]

[tool.ruff]
line-length = 100
